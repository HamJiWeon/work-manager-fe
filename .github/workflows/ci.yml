name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.lint ? 0 : 1)'; then
            npm run lint
          else
            echo "::warning::No lint script is configured; lint was skipped."
          fi

      - name: Test
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm run test -- --run
          else
            echo "::warning::No test script is configured; tests were skipped."
          fi

      - name: Build
        if: ${{ hashFiles('app/**', 'src/app/**', 'pages/**', 'src/pages/**') != '' }}
        run: npm run build

      - name: Type check
        if: ${{ hashFiles('app/**', 'src/app/**', 'pages/**', 'src/pages/**') != '' }}
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.typecheck ? 0 : 1)'; then
            npm run typecheck
          else
            ./node_modules/.bin/tsc --noEmit
          fi
